<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digital Console EQ</title>
<style>
	:root {
		--bg: #17181b;
		--screen: #08090b;
		--screen-edge: #2a2d34;
		--grid: #1f232a;
		--grid-strong: #313743;
		--text: #e8eaef;
		--muted: #8a909c;
		--curve: #f2b544;
		--curve-off: #6b707a;
		--select: #3d8ef0;
		--surface: #2a2c31;
		--surface-light: #34373d;
		--surface-edge: #43474f;
		--knob: #0d0e10;
		--knob-edge: #3c4048;
		--lit-amber: #f2b544;
		--lit-blue: #3d8ef0;
		--lit-green: #49c27d;
		--button: #1c1e22;
	}
	* {
		box-sizing: border-box;
	}
	html, body {
		margin: 0;
		width: 760px;
		height: 520px;
		overflow: hidden;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		user-select: none;
		-webkit-user-select: none;
	}
	button {
		font: inherit;
		color: inherit;
	}

	/* ---- screen ---- */

	.screen {
		position: absolute;
		left: 12px;
		top: 12px;
		width: 736px;
		height: 304px;
		padding: 8px 10px;
		background: var(--screen);
		border: 1px solid var(--screen-edge);
		border-radius: 8px;
	}
	.topbar {
		display: flex;
		align-items: center;
		gap: 8px;
		height: 34px;
	}
	.chip {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 6px;
		height: 30px;
		padding: 0 12px;
		border: 1px solid var(--screen-edge);
		border-radius: 4px;
		background: #121418;
		font-size: 12px;
		font-weight: 600;
		letter-spacing: 0.04em;
		color: var(--muted);
		cursor: pointer;
	}
	.chip[aria-pressed="true"] {
		color: var(--text);
		border-color: var(--lit-blue);
	}
	.chip.on[aria-pressed="true"] {
		background: var(--lit-amber);
		border-color: var(--lit-amber);
		color: #17181b;
	}
	.chip svg {
		width: 18px;
		height: 12px;
		fill: none;
		stroke: currentColor;
		stroke-width: 1.6;
	}
	.chip.on {
		width: 56px;
	}
	.title {
		margin-right: auto;
		padding-left: 6px;
		font-size: 13px;
		font-weight: 700;
		letter-spacing: 0.06em;
		color: var(--muted);
	}
	.mix-readout {
		min-width: 92px;
		cursor: ew-resize;
	}
	.mix-readout b {
		color: var(--text);
		font-variant-numeric: tabular-nums;
	}

	.main {
		display: flex;
		gap: 8px;
		margin-top: 6px;
		height: 208px;
	}
	.graph-wrap {
		position: relative;
		width: 604px;
		height: 208px;
	}
	#graph {
		display: block;
		width: 604px;
		height: 208px;
		cursor: crosshair;
		touch-action: none;
	}
	.bands {
		display: flex;
		flex-direction: column;
		gap: 4px;
		width: 104px;
	}
	.band {
		display: flex;
		align-items: center;
		height: 26px;
		padding: 0 8px;
		border: 1px solid var(--screen-edge);
		border-radius: 4px;
		background: #121418;
		cursor: pointer;
	}
	.band .name {
		width: 22px;
		font-size: 15px;
		font-weight: 600;
	}
	.band .type {
		margin-left: auto;
		padding: 1px 4px;
		border-radius: 3px;
		font-size: 11px;
		font-weight: 600;
		color: var(--muted);
	}
	.band .type.switchable {
		border: 1px solid var(--screen-edge);
	}
	.band.selected {
		background: var(--select);
		border-color: var(--select);
	}
	.band.selected .type {
		color: var(--text);
	}
	.band-solo {
		margin-top: auto;
		height: 30px;
		border: 1px solid var(--screen-edge);
		border-radius: 4px;
		background: #121418;
		font-size: 11px;
		font-weight: 700;
		letter-spacing: 0.05em;
		color: var(--muted);
		cursor: pointer;
	}
	.band-solo[aria-pressed="true"] {
		background: var(--lit-green);
		border-color: var(--lit-green);
		color: #0b0c0e;
	}

	.readouts {
		display: flex;
		gap: 18px;
		justify-content: center;
		gap: 40px;
		height: 34px;
		margin-top: 6px;
		padding: 0 8px;
	}
	.readout {
		width: 160px;
		cursor: ew-resize;
		touch-action: none;
	}
	.readout.hidden {
		visibility: hidden;
	}
	.readout .row {
		display: flex;
		justify-content: space-between;
		font-size: 12px;
	}
	.readout .label {
		font-weight: 600;
		color: var(--muted);
	}
	.readout .value {
		font-variant-numeric: tabular-nums;
	}
	.readout.active .label, .readout.active .value {
		color: var(--lit-blue);
	}
	.readout .bar {
		position: relative;
		height: 4px;
		margin-top: 5px;
		border-radius: 2px;
		background: var(--grid-strong);
	}
	.readout .bar i {
		position: absolute;
		top: -3px;
		width: 3px;
		height: 10px;
		margin-left: -1.5px;
		border-radius: 1px;
		background: var(--text);
	}
	.readout[data-mode="freq"] .bar i {
		width: 8px;
		margin-left: -4px;
		background: var(--lit-blue);
	}
	/* Q: a bar as wide as the band (low Q = wide), growing from the centre */
	.readout[data-mode="q"] .bar b {
		position: absolute;
		top: -1px;
		height: 6px;
		border-radius: 3px;
		background: var(--lit-green);
	}
	.readout[data-mode="q"] .bar i {
		left: 50%;
	}

	/* filter settings, over the lower part of the screen */
	.filters {
		position: absolute;
		left: 10px;
		width: 604px;
		bottom: 8px;
		display: none;
		align-items: center;
		justify-content: space-around;
		height: 108px;
		padding: 6px 10px;
		background: #15171b;
		border: 1px solid var(--screen-edge);
		border-radius: 6px;
	}
	.filters.open {
		display: flex;
	}
	.filter-group {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 0 6px;
	}
	.filter-group + .filter-group {
		border-left: 1px solid var(--screen-edge);
		padding-left: 16px;
	}
	.slopes {
		display: flex;
		flex-direction: column;
		gap: 3px;
	}
	.slopes span {
		font-size: 9.5px;
		font-weight: 600;
		letter-spacing: 0.06em;
		color: var(--muted);
		text-align: center;
	}
	.segmented {
		display: flex;
	}
	.segmented button {
		width: 28px;
		height: 22px;
		border: 1px solid var(--screen-edge);
		background: #121418;
		font-size: 11px;
		color: var(--muted);
		cursor: pointer;
	}
	.segmented button + button {
		border-left: none;
	}
	.segmented button[aria-pressed="true"] {
		background: var(--lit-blue);
		border-color: var(--lit-blue);
		color: var(--text);
	}

	/* ---- control surface ---- */

	.surface {
		position: absolute;
		left: 12px;
		top: 326px;
		width: 736px;
		height: 182px;
		padding: 10px 16px;
		background: linear-gradient(var(--surface-light), var(--surface));
		border: 1px solid var(--surface-edge);
		border-radius: 8px;
	}
	.surface h2 {
		margin: 0;
		font-size: 10.5px;
		font-weight: 700;
		letter-spacing: 0.12em;
		text-align: center;
		color: var(--muted);
	}
	.encoders {
		display: grid;
		grid-template-columns: 90px repeat(4, 1fr) 100px;
		align-items: center;
		height: 92px;
		margin-top: 2px;
	}
	.hw-buttons {
		display: flex;
		align-items: center;
		justify-content: space-between;
		height: 54px;
	}
	.hw-buttons .modes {
		display: flex;
		gap: 22px;
	}
	.hw {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 4px;
	}
	.hw button {
		width: 56px;
		height: 30px;
		border: 1px solid #50555e;
		border-radius: 4px;
		background: var(--button);
		font-size: 10.5px;
		font-weight: 700;
		letter-spacing: 0.06em;
		color: var(--muted);
		box-shadow: 0 1px 0 #00000080;
		cursor: pointer;
	}
	.hw span {
		font-size: 9px;
		font-weight: 600;
		letter-spacing: 0.06em;
		color: var(--muted);
	}
	.hw button[aria-pressed="true"] {
		color: #0b0c0e;
		background: var(--lit, var(--lit-blue));
		border-color: var(--lit, var(--lit-blue));
		box-shadow: 0 0 10px color-mix(in srgb, var(--lit, var(--lit-blue)) 60%, transparent);
	}
	.icon-label {
		display: flex;
		align-items: center;
		gap: 4px;
		height: 22px;
		padding: 0 8px;
		border-radius: 3px;
		background: #0d0e10;
	}
	.icon-label svg {
		width: 66px;
		height: 16px;
		fill: none;
		stroke-width: 1.8;
		stroke-linecap: round;
	}
	/* only the band's current type is lit */
	.icon-label path {
		stroke: var(--lit-amber);
		opacity: 0;
		filter: drop-shadow(0 0 2px var(--lit-amber));
	}
	.icon-label path.lit {
		opacity: 1;
	}

	/* knobs (encoders and small screen knobs) */
	.knob {
		display: flex;
		flex-direction: column;
		align-items: center;
		outline: none;
		cursor: ns-resize;
		touch-action: none;
	}
	.knob svg {
		width: 56px;
		height: 56px;
		overflow: visible;
	}
	.knob.small svg {
		width: 38px;
		height: 38px;
	}
	.knob .label {
		margin-top: 2px;
		font-size: 11px;
		font-weight: 700;
		color: var(--muted);
	}
	.knob .value {
		font-size: 11px;
		font-variant-numeric: tabular-nums;
	}
	.knob.small .label {
		font-size: 9.5px;
		letter-spacing: 0.06em;
	}
	.knob.disabled {
		opacity: 0.35;
		cursor: default;
	}
	.knob.selected .label {
		color: var(--lit-blue);
	}
	.knob.selected .body {
		stroke: var(--lit-blue);
	}
	.knob:focus-visible .body {
		stroke: var(--text);
	}
	.track {
		fill: none;
		stroke: #1b1d21;
		stroke-width: 5;
		stroke-linecap: round;
	}
	.fill {
		fill: none;
		stroke: var(--lit-blue);
		stroke-width: 5;
		stroke-linecap: round;
	}
	.body {
		fill: var(--knob);
		stroke: var(--knob-edge);
		stroke-width: 2;
	}
	.pointer {
		stroke: #f0f2f5;
		stroke-width: 4;
		stroke-linecap: round;
	}
	#build {
		position: absolute;
		right: 10px;
		bottom: 6px;
		font-size: 9px;
		color: var(--muted);
		opacity: 0.7;
	}
</style>
</head>
<body>
	<div class="screen">
		<div class="topbar">
			<button class="chip on" data-toggle="eqOn">ON</button>
			<span class="title">DIGITAL CONSOLE EQ</span>
			<div class="chip mix-readout" data-drag="mix" title="Drag sideways">MIX <b id="mix-value"></b></div>
			<button class="chip" data-toggle="lcOn" title="Lo cut">
				<svg viewBox="0 0 18 12"><path d="M1 11 Q5 1 9 1 H17"/></svg>LO CUT
			</button>
			<button class="chip" data-toggle="hcOn" title="Hi cut">
				<svg viewBox="0 0 18 12"><path d="M1 1 H9 Q13 1 17 11"/></svg>HI CUT
			</button>
			<button class="chip" data-toggle="tiltOn" title="Tilt EQ">
				<svg viewBox="0 0 18 12"><path d="M1 10 L17 2"/></svg>TILT
			</button>
			<button class="chip" id="filter-button" aria-pressed="false">FILTER ›</button>
		</div>

		<div class="main">
			<div class="graph-wrap">
				<canvas id="graph" width="1208" height="416" title="Drag a marker: up/down = gain, sideways = frequency · Ctrl+drag up/down or wheel = Q · Double-click = reset band"></canvas>
			</div>
			<div class="bands" id="bands">
				<button class="band-solo" data-toggle-solo aria-pressed="false">BAND SOLO</button>
			</div>
		</div>

		<div class="readouts">
			<div class="readout" data-mode="gain"><div class="row"><span class="label"></span><span class="value"></span></div><div class="bar"><i></i></div></div>
			<div class="readout" data-mode="q"><div class="row"><span class="label"></span><span class="value"></span></div><div class="bar"><b></b><i></i></div></div>
			<div class="readout" data-mode="freq"><div class="row"><span class="label"></span><span class="value"></span></div><div class="bar"><i></i></div></div>
		</div>

		<div class="filters" id="filters">
			<div class="filter-group">
				<div class="knob small" data-param="lcFreq" data-label="LO CUT"></div>
				<div class="slopes"><div class="segmented" data-stepped="lcSlope" data-options="6,12,18,24"></div><span>dB/OCT</span></div>
			</div>
			<div class="filter-group">
				<div class="knob small" data-param="hcFreq" data-label="HI CUT"></div>
				<div class="slopes"><div class="segmented" data-stepped="hcSlope" data-options="6,12"></div><span>dB/OCT</span></div>
			</div>
			<div class="filter-group">
				<div class="knob small" data-param="tiltGain" data-label="TILT"></div>
				<div class="knob small" data-param="tiltFreq" data-label="TILT FREQ"></div>
			</div>
		</div>
	</div>

	<div class="surface">
		<h2>CHANNEL EQUALIZER</h2>
		<div class="encoders">
			<div class="hw"><button id="shift" aria-pressed="false">SHIFT</button><span>L / H</span></div>
			<div class="knob encoder" data-encoder="0"></div>
			<div class="knob encoder" data-encoder="1"></div>
			<div class="knob encoder" data-encoder="2"></div>
			<div class="knob encoder" data-encoder="3"></div>
			<div class="knob" data-param="mix" data-label="BLEND/MIX"></div>
		</div>
		<div class="hw-buttons">
			<div class="hw" style="--lit: var(--lit-amber)"><button data-toggle="eqOn">EQ</button></div>
			<div class="icon-label" id="l-type" title="Low band (L) shape: shelf or bell, and LC when the lo cut filter is on"><svg viewBox="0 0 66 16"><path data-type="0" d="M2 4 H7 Q11 4 12 10 Q13 12 18 12"/><path data-type="1" d="M24 13 Q30 13 32 4 Q34 13 40 13"/><path data-type="cut" d="M47 14 Q50 4 56 4 H64"/></svg></div>
			<div class="modes">
				<div class="hw"><button data-mode-button="gain">GAIN</button></div>
				<div class="hw"><button data-mode-button="q">WIDTH</button></div>
				<div class="hw"><button data-mode-button="freq">FREQ</button></div>
			</div>
			<div class="icon-label" id="h-type" title="High band (H) shape: bell or shelf, and HC when the hi cut filter is on"><svg viewBox="0 0 66 16"><path data-type="cut" d="M2 4 H10 Q16 4 19 14"/><path data-type="1" d="M26 13 Q32 13 34 4 Q36 13 42 13"/><path data-type="0" d="M48 12 Q53 12 54 10 Q55 4 59 4 H64"/></svg></div>
			<div class="hw" style="--lit: var(--lit-green)"><button data-toggle-solo>LISTEN</button></div>
		</div>
		<div id="build"></div>
	</div>

<script src="response.js"></script>
<script>
	// ---- parameters (must match entry.cpp) ----

	const PARAMS = {
		lcOn: {min: 0, max: 1, def: 0},
		lcFreq: {min: 20, max: 2000, def: 100, unit: 'Hz', log: true},
		lcSlope: {min: 0, max: 3, def: 1},
		hcOn: {min: 0, max: 1, def: 0},
		hcFreq: {min: 50, max: 20000, def: 10000, unit: 'Hz', log: true},
		hcSlope: {min: 0, max: 1, def: 1},
		tiltOn: {min: 0, max: 1, def: 0},
		tiltGain: {min: -6, max: 6, def: 0, unit: 'dB', bipolar: true},
		tiltFreq: {min: 100, max: 10000, def: 1000, unit: 'Hz', log: true},
		eqOn: {min: 0, max: 1, def: 1},
		mix: {min: 0, max: 125, def: 100, unit: '%'},
		solo: {min: 0, max: 6, def: 0},
	};
	const BANDS = EqResponse.BANDS.map((band, i) => ({...band, label: ['L', '1', '2', '3', '4', 'H'][i]}));
	const DEFAULT_FREQS = [80, 200, 600, 1500, 4000, 12000];
	BANDS.forEach((band, i) => {
		PARAMS[band.gain] = {min: -15, max: 15, def: 0, unit: 'dB', bipolar: true};
		PARAMS[band.freq] = {min: 20, max: 20000, def: DEFAULT_FREQS[i], unit: 'Hz', log: true};
		PARAMS[band.q] = {min: 0.44, max: 10, def: 1, unit: 'Q', log: true};
		if (band.type) PARAMS[band.type] = {min: 0, max: 1, def: 0};
	});
	const MODE_KEY = {gain: 'gain', q: 'q', freq: 'freq'}; // mode -> band property holding the parameter key
	const MODE_LABEL = {gain: 'GAIN', q: 'Q', freq: 'FREQ'};

	// ---- talking to the plugin (clap.webview: ArrayBuffer messages, plain text inside) ----

	const standalone = (window.parent === window); // opened directly in a browser: demo mode
	const encoder = new TextEncoder(), decoder = new TextDecoder();
	function send(text) {
		if (standalone) return;
		window.parent.postMessage(encoder.encode(text).buffer, '*');
	}

	const state = Object.fromEntries(Object.entries(PARAMS).map(([key, p]) => [key, p.def]));
	if (standalone) {
		// demo mode: settings can be given in the address, e.g. index.html#b1Gain=4&lcOn=1
		for (const [key, value] of new URLSearchParams(location.hash.slice(1))) {
			if (key in state && Number.isFinite(parseFloat(value))) state[key] = parseFloat(value);
		}
	}
	let sampleRate = 48000;
	let activeKey = null; // parameter currently being changed in this UI

	// UI-only state, like the console's surface
	const ui = {band: 1, mode: 'gain', shift: false, filterOpen: false};
	if (standalone) {
		// demo mode can also show a particular view, e.g. #band=0&mode=freq&shift=1&filters=1
		const view = new URLSearchParams(location.hash.slice(1));
		if (view.has('band')) ui.band = Math.max(0, Math.min(5, parseInt(view.get('band')) || 0));
		if (['gain', 'q', 'freq'].includes(view.get('mode'))) ui.mode = view.get('mode');
		ui.shift = view.get('shift') === '1';
		ui.filterOpen = view.get('filters') === '1';
	}

	window.addEventListener('message', e => {
		let data = e.data;
		if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) data = decoder.decode(data);
		if (typeof data !== 'string') return;
		const [command, a, b] = data.split(' ');
		if (command === 'param' && a in state) {
			if (a === activeKey) return; // the user is moving this one, don't fight them
			state[a] = parseFloat(b);
			if (a === 'solo' && state.solo > 0) ui.band = state.solo - 1;
		} else if (command === 'samplerate') {
			sampleRate = parseFloat(a);
		} else if (command === 'build') {
			document.getElementById('build').textContent = `build ${a} (${b})`;
		}
		render();
	});

	function setValue(key, v) {
		const p = PARAMS[key];
		v = Math.max(p.min, Math.min(p.max, v));
		if (v === state[key]) return;
		state[key] = v;
		send(`set ${key} ${v}`);
		render();
	}
	function beginGesture(key) {
		activeKey = key;
		send(`begin ${key}`);
	}
	function endGesture(key) {
		send(`end ${key}`);
		setTimeout(() => {if (activeKey === key) activeKey = null;}, 250); // let the host's echo settle
	}
	function gesture(key, fn) {
		beginGesture(key);
		fn();
		endGesture(key);
	}
	function selectBand(b) {
		if (b === ui.band) return;
		ui.band = b;
		// band solo follows the selected band
		if (state.solo > 0) gesture('solo', () => setValue('solo', b + 1));
		render();
	}
	function resetBand(b) {
		const band = BANDS[b];
		for (const key of [band.gain, band.freq, band.q]) gesture(key, () => setValue(key, PARAMS[key].def));
	}

	// ---- values ----

	const toNorm = (key, v) => {
		const p = PARAMS[key];
		return p.log ? Math.log(v/p.min)/Math.log(p.max/p.min) : (v - p.min)/(p.max - p.min);
	};
	const fromNorm = (key, n) => {
		const p = PARAMS[key];
		n = Math.max(0, Math.min(1, n));
		return p.log ? p.min*Math.pow(p.max/p.min, n) : p.min + n*(p.max - p.min);
	};
	function tidy(key, v) {
		const unit = PARAMS[key].unit;
		if (unit === 'dB') return Math.round(v*10)/10;
		if (unit === 'Q') return Math.round(v*100)/100;
		if (unit === '%') return Math.round(v);
		if (unit === 'Hz') {
			const step = v < 1000 ? 0.1 : 10; // matches what's displayed
			return Math.round(Math.round(v/step)*step*10)/10;
		}
		return v;
	}
	function format(key, v) {
		const unit = PARAMS[key].unit;
		if (unit === 'dB') return `${v > 0.05 ? '+' : ''}${(Math.abs(v) < 0.05 ? 0 : v).toFixed(1)} dB`;
		if (unit === 'Q') return v.toFixed(2);
		if (unit === '%') return `${Math.round(v)} %`;
		if (unit === 'Hz') return v >= 999.95 ? `${(v/1000).toFixed(2).replace('.', 'k')} Hz` : `${v.toFixed(1)} Hz`;
		return String(v);
	}
	const bandType = b => EqResponse.bandType(BANDS[b], state);
	const typeName = b => bandType(b) === EqResponse.SHELF ? 'SHV' : 'PEQ';

	// ---- dragging (knobs, readouts, MIX) ----

	// keep receiving pointer moves outside the element while dragging
	function capture(el, e) {
		try {
			el.setPointerCapture(e.pointerId);
		} catch (error) {} // not available for synthetic events
	}

	// `getKey()` returns the parameter to change (or null), `axis` is 'y' (up = more) or 'x' (right = more)
	function draggable(el, getKey, {axis = 'y', onPress = null} = {}) {
		let start = null, startNorm = 0, key = null;
		el.addEventListener('pointerdown', e => {
			if (e.button !== 0) return;
			onPress?.();
			key = getKey();
			if (!key) return;
			capture(el, e);
			if (el.tabIndex >= 0) el.focus();
			start = axis === 'y' ? e.clientY : e.clientX;
			startNorm = toNorm(key, state[key]);
			beginGesture(key);
		});
		el.addEventListener('pointermove', e => {
			if (start === null) return;
			const pos = axis === 'y' ? e.clientY : e.clientX;
			const delta = axis === 'y' ? start - pos : pos - start;
			startNorm = Math.max(0, Math.min(1, startNorm + delta/(e.shiftKey ? 4000 : 200)));
			start = pos;
			setValue(key, tidy(key, fromNorm(key, startNorm)));
		});
		const end = () => {
			if (start === null) return;
			start = null;
			endGesture(key);
		};
		el.addEventListener('pointerup', end);
		el.addEventListener('pointercancel', end);
		el.addEventListener('dblclick', () => {
			const k = getKey();
			if (k) gesture(k, () => setValue(k, PARAMS[k].def));
		});
		const nudge = (amount) => {
			const k = getKey();
			if (!k) return;
			gesture(k, () => {
				const n = toNorm(k, state[k]) + amount;
				let v = tidy(k, fromNorm(k, n));
				if (v === state[k]) v = tidy(k, fromNorm(k, n + amount)); // step past rounding
				setValue(k, v);
			});
		};
		el.addEventListener('wheel', e => {
			e.preventDefault();
			onPress?.();
			nudge(-Math.sign(e.deltaY)*(e.shiftKey ? 0.001 : 0.02));
		}, {passive: false});
		el.addEventListener('keydown', e => {
			const steps = {ArrowUp: 0.02, ArrowRight: 0.02, ArrowDown: -0.02, ArrowLeft: -0.02, PageUp: 0.1, PageDown: -0.1};
			if (e.key in steps) {
				e.preventDefault();
				nudge(steps[e.key]*(e.shiftKey ? 0.05 : 1));
			}
		});
	}

	// ---- knobs ----

	const START = -135, END = 135;
	const polar = (deg, r) => [r*Math.sin(deg*Math.PI/180), -r*Math.cos(deg*Math.PI/180)];
	function arc(from, to, r) {
		const [x1, y1] = polar(from, r), [x2, y2] = polar(to, r);
		const large = Math.abs(to - from) > 180 ? 1 : 0, sweep = to > from ? 1 : 0;
		return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${large} ${sweep} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
	}
	function drawKnob(el, key, label) {
		el.querySelector('.label').textContent = label;
		const valueEl = el.querySelector('.value');
		if (!key) {
			el.querySelector('svg').innerHTML = `<path class="track" d="${arc(START, END, 44)}"/><circle class="body" r="35"/>`;
			if (valueEl) valueEl.textContent = '–';
			return;
		}
		const p = PARAMS[key], v = state[key];
		const angle = START + toNorm(key, v)*(END - START);
		const from = p.bipolar ? 0 : START;
		const [px, py] = polar(angle, 29);
		el.querySelector('svg').innerHTML = `
			<path class="track" d="${arc(START, END, 44)}"/>
			${Math.abs(angle - from) > 0.5 ? `<path class="fill" d="${arc(from, angle, 44)}"/>` : ''}
			<circle class="body" r="35"/>
			<line class="pointer" x1="${(px*0.35).toFixed(2)}" y1="${(py*0.35).toFixed(2)}" x2="${px.toFixed(2)}" y2="${py.toFixed(2)}"/>`;
		if (valueEl) valueEl.textContent = format(key, v);
		el.setAttribute('aria-valuetext', format(key, v));
	}
	document.querySelectorAll('.knob').forEach(el => {
		el.innerHTML = '<svg viewBox="-50 -50 100 100"></svg><span class="label"></span>' + (el.classList.contains('encoder') ? '' : '<span class="value"></span>');
		el.tabIndex = 0;
		el.setAttribute('role', 'slider');
	});

	// the four encoders: bands 1-4, or L and H with SHIFT
	const encoders = [...document.querySelectorAll('[data-encoder]')];
	const encoderBand = i => ui.shift ? (i === 0 ? 0 : i === 3 ? 5 : null) : i + 1;
	const encoderKey = i => {
		const b = encoderBand(i);
		if (b === null) return null;
		return BANDS[b][MODE_KEY[ui.mode]];
	};
	encoders.forEach((el, i) => {
		draggable(el, () => encoderKey(i), {onPress: () => {
			const b = encoderBand(i);
			if (b !== null) selectBand(b); // touching an encoder selects its band
		}});
	});
	const paramKnobs = [...document.querySelectorAll('.knob[data-param]')];
	paramKnobs.forEach(el => draggable(el, () => el.dataset.param));

	// ---- buttons ----

	document.querySelectorAll('[data-toggle]').forEach(el => {
		el.addEventListener('click', () => {
			const key = el.dataset.toggle;
			gesture(key, () => setValue(key, state[key] >= 0.5 ? 0 : 1));
		});
	});
	document.querySelectorAll('[data-toggle-solo]').forEach(el => {
		el.addEventListener('click', () => gesture('solo', () => setValue('solo', state.solo > 0 ? 0 : ui.band + 1)));
	});
	document.querySelectorAll('[data-mode-button]').forEach(el => {
		el.addEventListener('click', () => {
			ui.mode = el.dataset.modeButton;
			render();
		});
	});
	document.getElementById('shift').addEventListener('click', () => {
		ui.shift = !ui.shift;
		if (ui.shift && ui.band >= 1 && ui.band <= 4) selectBand(ui.band <= 2 ? 0 : 5);
		if (!ui.shift && (ui.band === 0 || ui.band === 5)) selectBand(ui.band === 0 ? 1 : 4);
		render();
	});
	document.getElementById('filter-button').addEventListener('click', () => {
		ui.filterOpen = !ui.filterOpen;
		render();
	});
	document.querySelectorAll('.segmented').forEach(el => {
		const key = el.dataset.stepped;
		el.dataset.options.split(',').forEach((label, i) => {
			const button = document.createElement('button');
			button.textContent = label;
			button.addEventListener('click', () => gesture(key, () => setValue(key, i)));
			el.appendChild(button);
		});
	});

	// band list
	const bandList = document.getElementById('bands');
	const bandRows = BANDS.map((band, b) => {
		const row = document.createElement('div');
		row.className = 'band';
		row.innerHTML = `<span class="name">${band.label}</span><span class="type${band.type ? ' switchable' : ''}"></span>`;
		row.addEventListener('click', () => selectBand(b));
		row.addEventListener('dblclick', () => resetBand(b));
		if (band.type) {
			row.querySelector('.type').title = 'Click to switch between shelf (SHV) and parametric (PEQ)';
			row.querySelector('.type').addEventListener('click', e => {
				e.stopPropagation();
				selectBand(b);
				gesture(band.type, () => setValue(band.type, state[band.type] >= 0.5 ? 0 : 1));
			});
		}
		bandList.insertBefore(row, bandList.lastElementChild);
		return row;
	});

	// readouts: GAIN / Q / FREQ of the selected band
	const readouts = [...document.querySelectorAll('.readout')];
	readouts.forEach(el => {
		draggable(el, () => BANDS[ui.band][MODE_KEY[el.dataset.mode]], {axis: 'x', onPress: () => {ui.mode = el.dataset.mode; render();}});
	});
	draggable(document.querySelector('.mix-readout'), () => 'mix', {axis: 'x'});

	// ---- graph ----

	const canvas = document.getElementById('graph');
	const ctx = canvas.getContext('2d');
	const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
	const F_MIN = 20, F_MAX = 20000, DB_RANGE = 18;
	const SCALE = canvas.width/604;
	const LABEL_SPACE = 22; // band letters along the top
	const xOf = f => Math.log(f/F_MIN)/Math.log(F_MAX/F_MIN)*canvas.width;
	const fOf = x => F_MIN*Math.pow(F_MAX/F_MIN, x/canvas.width);
	const plotTop = LABEL_SPACE*SCALE, plotBottom = canvas.height - 16*SCALE;
	const yOf = db => plotTop + (plotBottom - plotTop)*(0.5 - db/DB_RANGE/2);
	const dbOf = y => (0.5 - (y - plotTop)/(plotBottom - plotTop))*2*DB_RANGE;
	const markerDb = (b) => EqResponse.sectionsDb(state, sampleRate, state[BANDS[b].freq])[BANDS[b].id];

	function drawGraph() {
		const w = canvas.width, h = canvas.height, s = SCALE;
		ctx.clearRect(0, 0, w, h);

		// grid
		ctx.lineWidth = s;
		ctx.font = `${10*s}px system-ui, sans-serif`;
		for (const f of [30, 40, 50, 60, 70, 80, 90, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]) {
			ctx.strokeStyle = [100, 1000, 10000].includes(f) ? css('--grid-strong') : css('--grid');
			ctx.beginPath();
			ctx.moveTo(xOf(f), plotTop);
			ctx.lineTo(xOf(f), plotBottom);
			ctx.stroke();
		}
		ctx.fillStyle = css('--muted');
		for (const [f, label] of [[20, '20'], [50, '50'], [100, '100'], [200, '200'], [500, '500'], [1000, '1K'], [2000, '2K'], [5000, '5K'], [10000, '10K'], [20000, '20K']]) {
			ctx.textAlign = f === 20 ? 'left' : f === 20000 ? 'right' : 'center';
			ctx.fillText(label, xOf(f), h - 3*s);
		}
		ctx.textAlign = 'left';
		for (let db = -DB_RANGE; db <= DB_RANGE; db += 6) {
			ctx.strokeStyle = db === 0 ? css('--grid-strong') : css('--grid');
			ctx.beginPath();
			ctx.moveTo(0, yOf(db));
			ctx.lineTo(w, yOf(db));
			ctx.stroke();
			if (db !== 0 && Math.abs(db) !== DB_RANGE) {
				ctx.fillText((db > 0 ? '+' : '') + db, 3*s, yOf(db) - 3*s);
			}
		}

		// band lines and letters
		const eqOn = state.eqOn >= 0.5;
		ctx.textAlign = 'center';
		ctx.font = `600 ${12*s}px system-ui, sans-serif`;
		BANDS.forEach((band, b) => {
			const x = xOf(state[band.freq]), selected = b === ui.band;
			ctx.strokeStyle = selected ? css('--select') : '#3a3f48';
			ctx.lineWidth = (selected ? 2 : 1.2)*s;
			ctx.beginPath();
			ctx.moveTo(x, plotTop - 2*s);
			ctx.lineTo(x, plotBottom);
			ctx.stroke();
			ctx.fillStyle = selected ? css('--text') : css('--muted');
			ctx.fillText(band.label, x, plotTop - 7*s);
		});
		ctx.textAlign = 'left';

		// soloed band range
		if (state.solo > 0) {
			ctx.beginPath();
			for (let x = 0; x <= w; x += 2*s) {
				const y = yOf(Math.max(-DB_RANGE, Math.min(DB_RANGE, EqResponse.responseDb(state, sampleRate, fOf(x)))));
				x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
			}
			ctx.lineTo(w, plotBottom);
			ctx.lineTo(0, plotBottom);
			ctx.closePath();
			ctx.fillStyle = css('--lit-green');
			ctx.globalAlpha = 0.25;
			ctx.fill();
			ctx.globalAlpha = 1;
		}

		// curve: everything except the solo (the EQ as set), clipped to the plot area
		const curveState = {...state, solo: 0};
		ctx.save();
		ctx.beginPath();
		ctx.rect(0, plotTop, w, plotBottom - plotTop);
		ctx.clip();
		ctx.beginPath();
		for (let x = 0; x <= w; x += 2*s) {
			const y = yOf(Math.max(-DB_RANGE - 2, Math.min(DB_RANGE + 2, EqResponse.responseDb(curveState, sampleRate, fOf(x)))));
			x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
		}
		ctx.strokeStyle = eqOn ? css('--curve') : css('--curve-off');
		ctx.lineWidth = 2.5*s;
		ctx.lineJoin = 'round';
		ctx.stroke();
		ctx.restore();

		// markers
		BANDS.forEach((band, b) => {
			const x = xOf(state[band.freq]), y = yOf(Math.max(-DB_RANGE, Math.min(DB_RANGE, markerDb(b))));
			const selected = b === ui.band;
			ctx.beginPath();
			ctx.arc(x, y, (selected ? 9 : 8)*s, 0, 2*Math.PI);
			ctx.fillStyle = css('--screen');
			ctx.globalAlpha = 0.6;
			ctx.fill();
			ctx.globalAlpha = 1;
			ctx.lineWidth = (selected ? 3 : 2.2)*s;
			ctx.strokeStyle = selected ? '#ffffff' : '#c3c7ce';
			ctx.stroke();
		});
	}

	// graph interaction: drag markers like on a touch screen
	let graphDrag = null;
	function bandAt(px, py) {
		let best = null, bestDistance = 22*SCALE;
		BANDS.forEach((band, b) => {
			const x = xOf(state[band.freq]), y = yOf(Math.max(-DB_RANGE, Math.min(DB_RANGE, markerDb(b))));
			const distance = Math.hypot(px - x, py - y);
			if (distance < bestDistance) {
				best = b;
				bestDistance = distance;
			}
		});
		return best;
	}
	const canvasPoint = e => {
		const rect = canvas.getBoundingClientRect();
		return [(e.clientX - rect.left)*canvas.width/rect.width, (e.clientY - rect.top)*canvas.height/rect.height];
	};
	canvas.addEventListener('pointerdown', e => {
		if (e.button !== 0) return;
		const b = bandAt(...canvasPoint(e));
		if (b === null) return;
		selectBand(b);
		const band = BANDS[b];
		const keys = e.ctrlKey || e.metaKey ? [band.q] : [band.gain, band.freq];
		keys.forEach(beginGesture);
		graphDrag = {b, keys, qMode: e.ctrlKey || e.metaKey, x: e.clientX, y: e.clientY, qNorm: toNorm(band.q, state[band.q])};
		capture(canvas, e);
	});
	canvas.addEventListener('pointermove', e => {
		if (!graphDrag) return;
		const band = BANDS[graphDrag.b];
		if (graphDrag.qMode) {
			graphDrag.qNorm = Math.max(0, Math.min(1, graphDrag.qNorm + (graphDrag.y - e.clientY)/(e.shiftKey ? 2000 : 300)));
			graphDrag.y = e.clientY;
			setValue(band.q, tidy(band.q, fromNorm(band.q, graphDrag.qNorm)));
			return;
		}
		const [px, py] = canvasPoint(e);
		const fine = e.shiftKey ? 0.1 : 1;
		const [startX, startY] = canvasPoint({clientX: graphDrag.x, clientY: graphDrag.y});
		const newFreq = Math.exp(Math.log(state[band.freq]) + (Math.log(fOf(px)) - Math.log(fOf(startX)))*fine);
		const newGain = state[band.gain] + (dbOf(py) - dbOf(startY))*fine;
		graphDrag.x = e.clientX;
		graphDrag.y = e.clientY;
		setValue(band.gain, tidy(band.gain, newGain));
		setValue(band.freq, tidy(band.freq, newFreq));
	});
	const endGraphDrag = () => {
		if (!graphDrag) return;
		graphDrag.keys.forEach(endGesture);
		graphDrag = null;
	};
	canvas.addEventListener('pointerup', endGraphDrag);
	canvas.addEventListener('pointercancel', endGraphDrag);
	canvas.addEventListener('dblclick', e => {
		const b = bandAt(...canvasPoint(e));
		if (b !== null) resetBand(b);
	});
	canvas.addEventListener('wheel', e => {
		const b = bandAt(...canvasPoint(e)) ?? ui.band;
		e.preventDefault();
		selectBand(b);
		const key = BANDS[b].q;
		gesture(key, () => {
			const n = toNorm(key, state[key]) - Math.sign(e.deltaY)*(e.shiftKey ? 0.002 : 0.02);
			setValue(key, tidy(key, fromNorm(key, n)));
		});
	}, {passive: false});

	// ---- rendering ----

	let frame = 0;
	function render() {
		if (frame) return;
		frame = requestAnimationFrame(() => {
			frame = 0;
			const band = BANDS[ui.band];

			document.querySelectorAll('[data-toggle]').forEach(el => el.setAttribute('aria-pressed', state[el.dataset.toggle] >= 0.5));
			document.querySelectorAll('[data-toggle-solo]').forEach(el => el.setAttribute('aria-pressed', state.solo > 0));
			document.querySelectorAll('[data-mode-button]').forEach(el => el.setAttribute('aria-pressed', el.dataset.modeButton === ui.mode));
			document.getElementById('shift').setAttribute('aria-pressed', ui.shift);
			document.getElementById('filter-button').setAttribute('aria-pressed', ui.filterOpen);
			document.getElementById('filters').classList.toggle('open', ui.filterOpen);
			document.querySelector('.readouts').style.visibility = ui.filterOpen ? 'hidden' : '';
			document.getElementById('mix-value').textContent = format('mix', state.mix);
			document.querySelectorAll('.segmented').forEach(el => {
				[...el.children].forEach((button, i) => button.setAttribute('aria-pressed', Math.round(state[el.dataset.stepped]) === i));
			});

			bandRows.forEach((row, b) => {
				row.classList.toggle('selected', b === ui.band);
				row.querySelector('.type').textContent = typeName(b);
			});

			readouts.forEach(el => {
				const mode = el.dataset.mode, key = band[MODE_KEY[mode]];
				el.classList.toggle('active', mode === ui.mode);
				el.querySelector('.label').textContent = `${MODE_LABEL[mode]} ${band.label}`;
				el.querySelector('.value').textContent = format(key, state[key]);
				if (mode === 'q') {
					const width = Math.max(4, (1 - toNorm(key, state[key]))*100);
					Object.assign(el.querySelector('.bar b').style, {left: `${50 - width/2}%`, width: `${width}%`});
				} else {
					el.querySelector('.bar i').style.left = `${toNorm(key, state[key])*100}%`;
				}
			});

			encoders.forEach((el, i) => {
				const b = encoderBand(i), key = encoderKey(i);
				el.classList.toggle('disabled', key === null);
				el.classList.toggle('selected', b === ui.band);
				drawKnob(el, key, b === null ? '' : BANDS[b].label);
			});
			paramKnobs.forEach(el => drawKnob(el, el.dataset.param, el.dataset.label));
			// band type displays: the band's shape (shelf or bell), plus the input slot's cut filter when it's on
			for (const [id, b, cutKey] of [['l-type', 0, 'lcOn'], ['h-type', 5, 'hcOn']]) {
				document.querySelectorAll(`#${id} path`).forEach(path => {
					const type = path.dataset.type;
					path.classList.toggle('lit', type === 'cut' ? state[cutKey] >= 0.5 : Number(type) === bandType(b));
				});
			}

			drawGraph();
		});
	}
	render();
	send('ready');
	// ask for changes made elsewhere (automation, the host's own controls) while we're visible
	setInterval(() => {
		if (document.visibilityState === 'visible') send('poll');
	}, 33);
</script>
</body>
</html>
