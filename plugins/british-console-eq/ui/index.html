<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>British Console EQ</title>
<style>
	:root {
		--bg: #2b2c2f;
		--screen: #0c0d0f;
		--screen-edge: #3c3f45;
		--grid: #1d2026;
		--grid-strong: #30343c;
		--curve: #f4ecd8;
		--panel-top: #777a7f;
		--panel-bottom: #5f6267;
		--panel-edge: #4a4d52;
		--ink: #f6f6f4;
		--filters: #8f9399;
		--lf: #b9bcc1;
		--lmf: #5b7cff;
		--hmf: #3fbf5a;
		--hf: #ad74ea;
		--led-on: #ff2b1f;
	}
	* {
		box-sizing: border-box;
	}
	html, body {
		margin: 0;
		width: 850px;
		height: 374px;
		overflow: hidden;
		background: var(--bg);
		font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
		user-select: none;
		-webkit-user-select: none;
	}

	/* ---- curve display (like a meter bridge above the panel) ---- */

	.bridge {
		position: absolute;
		left: 10px;
		top: 10px;
		width: 830px;
		height: 92px;
		padding: 6px 8px;
		background: var(--screen);
		border: 1px solid var(--screen-edge);
		border-radius: 6px;
	}
	#curve {
		display: block;
		width: 812px;
		height: 78px;
	}

	/* ---- the panel ---- */

	.panel {
		position: absolute;
		left: 10px;
		top: 110px;
		width: 830px;
		height: 254px;
		background:
			repeating-linear-gradient(90deg, #ffffff05 0 1px, transparent 1px 3px),
			linear-gradient(var(--panel-top), var(--panel-bottom));
		border: 1px solid var(--panel-edge);
		border-radius: 8px;
		box-shadow: inset 0 1px 0 #ffffff30;
	}
	.panel h1 {
		position: absolute;
		left: 0;
		right: 0;
		top: 6px;
		margin: 0;
		font: 600 19px Georgia, "Times New Roman", serif;
		color: var(--ink);
		text-align: center;
		text-shadow: 0 1px 2px #00000080;
	}
	.lines {
		position: absolute;
		inset: 0;
		pointer-events: none;
	}
	.lines path {
		fill: none;
		stroke: var(--ink);
		stroke-width: 2;
		opacity: 0.85;
	}
	.lines circle {
		fill: #3a3c40;
		stroke: #8d9095;
		stroke-width: 1.5;
	}
	.section-label {
		position: absolute;
		font-size: 13px;
		font-weight: 700;
		color: var(--ink);
		text-shadow: 0 1px 1px #00000060;
		pointer-events: none;
	}

	.knob {
		position: absolute;
		width: 92px;
		height: 92px;
		margin: -46px 0 0 -46px;
		outline: none;
		cursor: ns-resize;
		touch-action: none;
	}
	.knob svg {
		width: 92px;
		height: 92px;
		overflow: visible;
	}
	.knob .dot {
		fill: var(--ink);
	}
	.knob .scale {
		font: 700 14px Arial, sans-serif;
		fill: var(--ink);
		text-anchor: middle;
		dominant-baseline: middle;
	}
	.knob .unit {
		font: 700 13px Arial, sans-serif;
		fill: #d9dadc;
		text-anchor: middle;
	}
	.knob:focus-visible .skirt {
		stroke: var(--ink);
		stroke-width: 2;
	}

	.switch {
		position: absolute;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
		margin-left: -16px;
	}
	.switch button {
		width: 32px;
		height: 40px;
		padding: 0;
		border: 1px solid #2d2f33;
		border-radius: 2px;
		background: linear-gradient(#f0f0ee, #c9c9c6);
		box-shadow: 0 3px 0 #2f3135, 0 4px 6px #00000060;
		font: 700 10px/1.15 Arial, sans-serif;
		color: #1f2023;
		cursor: pointer;
	}
	.switch button[aria-pressed="true"] {
		transform: translateY(2px);
		background: linear-gradient(#dededb, #b9b9b6);
		box-shadow: 0 1px 0 #2f3135, 0 2px 3px #00000060;
	}
	.led {
		width: 12px;
		height: 12px;
		border-radius: 50%;
		background: radial-gradient(circle at 35% 35%, #5a2020, #2a0d0d);
		box-shadow: inset 0 0 2px #000;
	}
	.switch button[aria-pressed="true"] + .led {
		background: radial-gradient(circle at 35% 35%, #ffb3ad, var(--led-on) 55%, #a10b04);
		box-shadow: 0 0 8px var(--led-on);
	}

	#bubble {
		position: absolute;
		display: none;
		padding: 3px 7px;
		background: #111214e6;
		border: 1px solid #50545b;
		border-radius: 4px;
		font: 600 12px Arial, sans-serif;
		color: #f4f4f4;
		white-space: nowrap;
		pointer-events: none;
		transform: translate(-50%, -100%);
	}
	#build {
		position: absolute;
		right: 10px;
		bottom: 4px;
		font-size: 9px;
		color: #e2e3e5;
		opacity: 0.6;
	}
</style>
</head>
<body>
	<div class="bridge"><canvas id="curve" width="1624" height="156"></canvas></div>

	<div class="panel" id="panel">
		<svg class="lines" viewBox="0 0 830 254">
			<!-- section dividers -->
			<path d="M146 14 V240"/>
			<path d="M256 14 V240"/>
			<path d="M456 42 V240"/>
			<path d="M656 14 V240"/>
			<path d="M764 14 V240"/>
			<!-- screws -->
			<circle cx="12" cy="12" r="4"/><circle cx="818" cy="12" r="4"/>
			<circle cx="12" cy="242" r="4"/><circle cx="818" cy="242" r="4"/>
		</svg>
		<h1>British Console EQ</h1>
		<div id="build"></div>
	</div>
	<div id="bubble"></div>

<script src="response.js"></script>
<script>
	// ---- parameters (must match entry.cpp) ----
	// `scale`: [value, angle] pairs where the panel prints a number (angles from -135 to 135, 0 = up).
	// The knob travel follows these marks, so the printed numbers are where the values really are.

	const PARAMS = {
		hpfOn: {min: 0, max: 1, def: 0},
		hpfFreq: {min: 16, max: 350, def: 80, unit: 'Hz', log: true,
			scale: [[16, -135], [30, -90], [50, -45], [80, 0], [150, 45], [250, 90], [350, 135]]},
		lpfOn: {min: 0, max: 1, def: 0},
		lpfFreq: {min: 3000, max: 22000, def: 12000, unit: 'Hz', log: true, kHz: true,
			scale: [[3000, -135], [5000, -90], [8000, -45], [12000, 0], [15000, 45], [18000, 90], [22000, 135]]},
		lfGain: {min: -18, max: 18, def: 0, unit: 'dB'},
		lfFreq: {min: 30, max: 450, def: 200, unit: 'Hz', log: true,
			scale: [[30, -135], [50, -90], [100, -45], [200, 0], [300, 45], [450, 135]]},
		lmfGain: {min: -18, max: 18, def: 0, unit: 'dB'},
		lmfFreq: {min: 100, max: 2500, def: 1000, unit: 'Hz', log: true, kHz: true,
			scale: [[100, -135], [200, -90], [400, -45], [1000, 0], [1500, 45], [2000, 90], [2500, 135]]},
		lmfQ: {min: 0.1, max: 3.5, def: 0.8, unit: 'Q', log: true,
			scale: [[0.1, -135], [0.3, -67.5], [0.8, 0], [1.5, 67.5], [3.5, 135]]},
		hmfGain: {min: -18, max: 18, def: 0, unit: 'dB'},
		hmfFreq: {min: 600, max: 7000, def: 3000, unit: 'Hz', log: true, kHz: true,
			scale: [[600, -135], [800, -90], [1500, -45], [3000, 0], [4500, 45], [6000, 90], [7000, 135]]},
		hmfQ: {min: 0.1, max: 3.5, def: 0.8, unit: 'Q', log: true,
			scale: [[0.1, -135], [0.3, -67.5], [0.8, 0], [1.5, 67.5], [3.5, 135]]},
		hfGain: {min: -18, max: 18, def: 0, unit: 'dB'},
		hfFreq: {min: 1500, max: 16000, def: 8000, unit: 'Hz', log: true, kHz: true,
			scale: [[1500, -135], [2000, -90], [5000, -45], [8000, 0], [10000, 45], [14000, 90], [16000, 135]]},
		eqIn: {min: 0, max: 1, def: 1},
	};
	for (const p of Object.values(PARAMS)) {
		if (!p.scale && p.unit) p.scale = [[p.min, -135], [p.max, 135]];
	}

	// ---- layout: knob positions on the panel, colours, section labels ----

	const KNOBS = [
		{key: 'hpfFreq', x: 54, y: 96, color: '#3f4247'},
		{key: 'lpfFreq', x: 54, y: 196, color: '#3f4247'},
		{key: 'lfGain', x: 200, y: 96, color: '#8d9095'},
		{key: 'lfFreq', x: 200, y: 196, color: '#8d9095'},
		{key: 'lmfGain', x: 354, y: 96, color: '#2440d8'},
		{key: 'lmfQ', x: 306, y: 196, color: '#2440d8'},
		{key: 'lmfFreq', x: 404, y: 196, color: '#2440d8'},
		{key: 'hmfGain', x: 556, y: 96, color: '#178a30'},
		{key: 'hmfQ', x: 508, y: 196, color: '#178a30'},
		{key: 'hmfFreq', x: 604, y: 196, color: '#178a30'},
		{key: 'hfGain', x: 710, y: 96, color: '#7432b4'},
		{key: 'hfFreq', x: 710, y: 196, color: '#7432b4'},
	];
	const SWITCHES = [
		{key: 'hpfOn', x: 122, y: 70, label: 'HPF<br>IN'},
		{key: 'lpfOn', x: 122, y: 170, label: 'LPF<br>IN'},
		{key: 'eqIn', x: 797, y: 70, label: 'EQ<br>IN'},
	];
	const LABELS = [
		['FILTERS', 12, 26], ['LF', 230, 34], ['LMF', 384, 34], ['HMF', 586, 34], ['HF', 740, 34],
	];
	const BAND_OF = key => key.match(/^(hpf|lpf|lf|lmf|hmf|hf)/)?.[1].replace(/^(hpf|lpf)$/, 'filters') ?? null;

	// ---- talking to the plugin (clap.webview: ArrayBuffer messages, plain text inside) ----

	const standalone = (window.parent === window); // opened directly in a browser: demo mode
	const encoder = new TextEncoder(), decoder = new TextDecoder();
	function send(text) {
		if (standalone) return;
		window.parent.postMessage(encoder.encode(text).buffer, '*');
	}

	const state = Object.fromEntries(Object.entries(PARAMS).map(([key, p]) => [key, p.def]));
	if (standalone) {
		// demo mode: settings can be given in the address, e.g. index.html#lfGain=4&hpfOn=1
		for (const [key, value] of new URLSearchParams(location.hash.slice(1))) {
			if (key in state && Number.isFinite(parseFloat(value))) state[key] = parseFloat(value);
		}
	}
	let sampleRate = 48000;
	let activeKey = null; // parameter currently being changed in this UI
	let hoveredBand = null;

	window.addEventListener('message', e => {
		let data = e.data;
		if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) data = decoder.decode(data);
		if (typeof data !== 'string') return;
		const [command, a, b] = data.split(' ');
		if (command === 'param' && a in state) {
			if (a === activeKey) return; // the user is moving this one, don't fight them
			state[a] = parseFloat(b);
		} else if (command === 'samplerate') {
			sampleRate = parseFloat(a);
		} else if (command === 'build') {
			document.getElementById('build').textContent = `build ${a} (${b})`;
		}
		render();
	});

	function setValue(key, v) {
		const p = PARAMS[key];
		v = Math.max(p.min, Math.min(p.max, v));
		if (v === state[key]) return;
		state[key] = v;
		send(`set ${key} ${v}`);
		render();
	}
	function beginGesture(key) {
		activeKey = key;
		send(`begin ${key}`);
	}
	function endGesture(key) {
		send(`end ${key}`);
		setTimeout(() => {if (activeKey === key) activeKey = null;}, 250); // let the host's echo settle
	}
	function gesture(key, fn) {
		beginGesture(key);
		fn();
		endGesture(key);
	}

	// ---- value <-> knob angle, following the printed scale ----

	function valueToAngle(key, v) {
		const p = PARAMS[key], scale = p.scale, f = x => p.log ? Math.log(x) : x;
		for (let i = 0; i < scale.length - 1; ++i) {
			const [v0, a0] = scale[i], [v1, a1] = scale[i + 1];
			const lo = Math.min(v0, v1), hi = Math.max(v0, v1);
			if (v >= lo && v <= hi) return a0 + (f(v) - f(v0))/(f(v1) - f(v0))*(a1 - a0);
		}
		return v <= Math.min(scale[0][0], scale[scale.length - 1][0]) === (scale[0][0] < scale[scale.length - 1][0]) ? -135 : 135;
	}
	function angleToValue(key, angle) {
		const p = PARAMS[key], scale = p.scale, f = x => p.log ? Math.log(x) : x, fi = x => p.log ? Math.exp(x) : x;
		angle = Math.max(-135, Math.min(135, angle));
		for (let i = 0; i < scale.length - 1; ++i) {
			const [v0, a0] = scale[i], [v1, a1] = scale[i + 1];
			if (angle >= a0 && angle <= a1) return fi(f(v0) + (angle - a0)/(a1 - a0)*(f(v1) - f(v0)));
		}
		return scale[scale.length - 1][0];
	}
	const toNorm = (key, v) => (valueToAngle(key, v) + 135)/270;
	const fromNorm = (key, n) => angleToValue(key, Math.max(0, Math.min(1, n))*270 - 135);

	function tidy(key, v) {
		const unit = PARAMS[key].unit;
		if (unit === 'dB') return Math.round(v*10)/10;
		if (unit === 'Q') return Math.round(v*100)/100;
		if (unit === '%') return Math.round(v);
		if (unit === 'Hz') return v < 1000 ? Math.round(v) : Math.round(v/10)*10;
		return v;
	}
	function format(key, v) {
		const unit = PARAMS[key].unit;
		if (unit === 'dB') return `${v > 0.05 ? '+' : ''}${(Math.abs(v) < 0.05 ? 0 : v).toFixed(1)} dB`;
		if (unit === 'Q') return `Q ${v.toFixed(2)}`;
		if (unit === '%') return `${Math.round(v)} %`;
		if (unit === 'Hz') return v >= 1000 ? `${(v/1000).toFixed(2)} kHz` : `${Math.round(v)} Hz`;
		return String(v);
	}
	const scaleText = (key, v) => {
		const p = PARAMS[key];
		return p.kHz ? String(v/1000) : String(v);
	};

	// ---- knobs ----

	const panel = document.getElementById('panel');
	const bubble = document.getElementById('bubble');
	const polar = (deg, r) => [r*Math.sin(deg*Math.PI/180), -r*Math.cos(deg*Math.PI/180)];

	// a colour darkened towards black, 0 = unchanged, 1 = black
	function shade(hex, amount) {
		const n = parseInt(hex.slice(1), 16);
		const channel = shift => Math.round(((n >> shift) & 255)*(1 - amount));
		return `rgb(${channel(16)}, ${channel(8)}, ${channel(0)})`;
	}
	// six grip grooves around the cap's side wall (they turn with the knob)
	const grooves = [0, 60, 120, 180, 240, 300].map(angle =>
		`<rect x="-2" y="-27.5" width="4" height="5.5" rx="1.4" fill="#000000" opacity="0.7" transform="rotate(${angle})"/>`).join('');

	function knobSvg(knob) {
		const p = PARAMS[knob.key];
		let marks = '';
		for (let i = 0; i <= 10; ++i) {
			const [x, y] = polar(-135 + i*27, 38);
			marks += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/>`;
		}
		if (p.unit === 'dB') {
			const [lx, ly] = polar(-150, 47), [rx, ry] = polar(150, 47);
			marks += `<text class="scale" x="${lx}" y="${ly}">−</text><text class="scale" x="${rx}" y="${ry}">+</text>`;
		} else if (p.scale.length > 2) {
			for (const [value, angle] of p.scale) {
				const [x, y] = polar(angle, 49);
				marks += `<text class="scale" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${scaleText(knob.key, value)}</text>`;
			}
		}
		if (p.unit === 'Q') {
			// wide and narrow bell symbols at the ends
			marks += `<path d="M-40 54 V46 Q-40 44 -38 44 H-32 Q-30 44 -30 46 V54" fill="none" stroke="#f6f6f4" stroke-width="1.8"/>
				<path d="M30 54 L35 44 L40 54" fill="none" stroke="#f6f6f4" stroke-width="1.8"/>`;
		}
		const unit = {dB: 'dB', Hz: p.kHz ? 'kHz' : 'Hz', Q: 'Q', '%': '%'}[p.unit];
		return `<svg viewBox="-62 -62 124 124">
			${marks}
			<text class="unit" x="0" y="48">${unit}</text>
			<circle class="skirt" r="31" fill="url(#skirt)" stroke="#2e3034" stroke-width="1"/>
			<!-- cap: a darker side wall with six grip grooves, and a flat top lit from the top-left -->
			<circle r="27" fill="${shade(knob.color, 0.55)}"/>
			<g class="rotate">${grooves}</g>
			<circle r="27" fill="url(#side-light)"/>
			<circle r="22.5" fill="${knob.color}"/>
			<circle r="22.5" fill="url(#face-light)"/>
			<circle r="22.5" fill="none" stroke="url(#face-edge)" stroke-width="1.6"/>
			<g class="rotate"><line x1="0" y1="-4" x2="0" y2="-20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/></g>
		</svg>`;
	}

	const knobEls = KNOBS.map(knob => {
		const el = document.createElement('div');
		el.className = 'knob';
		el.dataset.key = knob.key;
		el.style.left = `${knob.x}px`;
		el.style.top = `${knob.y}px`;
		el.tabIndex = 0;
		el.setAttribute('role', 'slider');
		el.setAttribute('aria-label', knob.key);
		el.innerHTML = knobSvg(knob);
		panel.appendChild(el);
		attachKnob(el, knob.key);
		return el;
	});
	// shared gradients for the knobs
	document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute">
		<defs>
			<!-- all light comes from the top-left -->
			<linearGradient id="skirt" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
				<stop offset="0" stop-color="#f4f5f6"/><stop offset="0.5" stop-color="#b5b8bc"/><stop offset="1" stop-color="#5f6267"/>
			</linearGradient>
			<linearGradient id="side-light" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
				<stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
				<stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
			</linearGradient>
			<linearGradient id="face-light" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
				<stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
			</linearGradient>
			<linearGradient id="face-edge" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
				<stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
				<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
			</linearGradient>
		</defs></svg>`);

	for (const [text, x, y] of LABELS) {
		const el = document.createElement('div');
		el.className = 'section-label';
		el.textContent = text;
		el.style.left = `${x}px`;
		el.style.top = `${y}px`;
		panel.appendChild(el);
	}

	function showBubble(el, key) {
		const rect = el.getBoundingClientRect();
		bubble.textContent = format(key, state[key]);
		bubble.style.left = `${rect.left + rect.width/2}px`;
		bubble.style.top = `${rect.top + 10}px`;
		bubble.style.display = 'block';
	}
	let bubbleOwner = null;

	function attachKnob(el, key) {
		let startY = null, startNorm = 0;
		el.addEventListener('pointerdown', e => {
			if (e.button !== 0) return;
			try {
				el.setPointerCapture(e.pointerId);
			} catch (error) {} // not available for synthetic events
			el.focus();
			startY = e.clientY;
			startNorm = toNorm(key, state[key]);
			beginGesture(key);
		});
		el.addEventListener('pointermove', e => {
			if (startY === null) return;
			startNorm = Math.max(0, Math.min(1, startNorm + (startY - e.clientY)/(e.shiftKey ? 4000 : 200)));
			startY = e.clientY;
			setValue(key, tidy(key, fromNorm(key, startNorm)));
		});
		const endDrag = () => {
			if (startY === null) return;
			startY = null;
			endGesture(key);
		};
		el.addEventListener('pointerup', endDrag);
		el.addEventListener('pointercancel', endDrag);
		el.addEventListener('dblclick', () => gesture(key, () => setValue(key, PARAMS[key].def)));
		const nudge = (amount) => gesture(key, () => {
			const n = toNorm(key, state[key]) + amount;
			let v = tidy(key, fromNorm(key, n));
			if (v === state[key]) v = tidy(key, fromNorm(key, n + amount)); // step past rounding
			setValue(key, v);
		});
		el.addEventListener('wheel', e => {
			e.preventDefault();
			nudge(-Math.sign(e.deltaY)*(e.shiftKey ? 0.001 : 0.02));
		}, {passive: false});
		el.addEventListener('keydown', e => {
			const steps = {ArrowUp: 0.02, ArrowRight: 0.02, ArrowDown: -0.02, ArrowLeft: -0.02, PageUp: 0.1, PageDown: -0.1};
			if (e.key in steps) {
				e.preventDefault();
				nudge(steps[e.key]*(e.shiftKey ? 0.05 : 1));
			} else if (e.key === 'Home' || e.key === 'Delete') {
				e.preventDefault();
				gesture(key, () => setValue(key, PARAMS[key].def));
			}
		});
		// value bubble while hovering or turning
		el.addEventListener('pointerenter', () => {
			bubbleOwner = el;
			hoveredBand = BAND_OF(key);
			render();
		});
		el.addEventListener('pointerleave', () => {
			if (startY !== null) return;
			bubbleOwner = null;
			hoveredBand = null;
			render();
		});
		el.addEventListener('lostpointercapture', () => {
			if (!el.matches(':hover')) {
				bubbleOwner = null;
				hoveredBand = null;
				render();
			}
		});
	}

	// ---- switches ----

	const switchEls = SWITCHES.map(sw => {
		const el = document.createElement('div');
		el.className = 'switch';
		el.style.left = `${sw.x}px`;
		el.style.top = `${sw.y}px`;
		el.innerHTML = `<button aria-pressed="false">${sw.label}</button><span class="led"></span>`;
		el.querySelector('button').addEventListener('click', () => gesture(sw.key, () => setValue(sw.key, state[sw.key] >= 0.5 ? 0 : 1)));
		el.addEventListener('pointerenter', () => {hoveredBand = BAND_OF(sw.key); render();});
		el.addEventListener('pointerleave', () => {hoveredBand = null; render();});
		panel.appendChild(el);
		return {el, key: sw.key};
	});

	// ---- curve ----

	const canvas = document.getElementById('curve');
	const ctx = canvas.getContext('2d');
	const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
	const F_MIN = 20, F_MAX = 20000, DB_RANGE = 20;
	const BAND_FREQ = {lf: 'lfFreq', lmf: 'lmfFreq', hmf: 'hmfFreq', hf: 'hfFreq'};

	function drawCurve() {
		const w = canvas.width, h = canvas.height, s = w/812;
		const xOf = f => Math.log(f/F_MIN)/Math.log(F_MAX/F_MIN)*w;
		const yOf = db => h/2 - db/DB_RANGE*(h/2 - 6*s);
		const fOf = x => F_MIN*Math.pow(F_MAX/F_MIN, x/w);
		ctx.clearRect(0, 0, w, h);

		ctx.lineWidth = s;
		ctx.font = `${10*s}px Arial, sans-serif`;
		for (const f of [30, 40, 50, 60, 70, 80, 90, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]) {
			ctx.strokeStyle = [100, 1000, 10000].includes(f) ? css('--grid-strong') : css('--grid');
			ctx.beginPath();
			ctx.moveTo(xOf(f), 0);
			ctx.lineTo(xOf(f), h);
			ctx.stroke();
		}
		ctx.fillStyle = '#7d828c';
		for (const [f, label] of [[20, '20'], [50, '50'], [100, '100'], [200, '200'], [500, '500'], [1000, '1k'], [2000, '2k'], [5000, '5k'], [10000, '10k'], [20000, '20k']]) {
			ctx.textAlign = f === 20000 ? 'right' : 'left';
			ctx.fillText(label, f === 20000 ? w - 3*s : xOf(f) + 3*s, h - 4*s);
		}
		ctx.textAlign = 'left';
		for (const db of [-18, -12, -6, 6, 12, 18]) {
			ctx.strokeStyle = css('--grid');
			ctx.beginPath();
			ctx.moveTo(0, yOf(db));
			ctx.lineTo(w, yOf(db));
			ctx.stroke();
			if (Math.abs(db) === 12) ctx.fillText((db > 0 ? '+' : '') + db, 4*s, yOf(db) - 3*s);
		}
		ctx.strokeStyle = css('--grid-strong');
		ctx.beginPath();
		ctx.moveTo(0, yOf(0));
		ctx.lineTo(w, yOf(0));
		ctx.stroke();

		const xs = [];
		for (let x = 0; x <= w; x += 2) xs.push(x);
		const sections = xs.map(x => EqResponse.sectionsDb(state, sampleRate, fOf(x)));
		const clampDb = db => Math.max(-DB_RANGE - 2, Math.min(DB_RANGE + 2, db));
		const eqOn = state.eqIn >= 0.5;

		ctx.save();
		ctx.beginPath();
		ctx.rect(0, 0, w, h);
		ctx.clip();
		for (const band of ['filters', 'lf', 'lmf', 'hmf', 'hf']) {
			const active = band === 'filters' ? (state.hpfOn >= 0.5 || state.lpfOn >= 0.5) : eqOn;
			if (!active) continue;
			const highlight = hoveredBand === band;
			ctx.beginPath();
			ctx.moveTo(0, yOf(0));
			xs.forEach((x, i) => ctx.lineTo(x, yOf(clampDb(sections[i][band]))));
			ctx.lineTo(w, yOf(0));
			ctx.closePath();
			ctx.fillStyle = css('--' + band);
			ctx.globalAlpha = highlight ? 0.35 : 0.12;
			ctx.fill();
			ctx.globalAlpha = highlight ? 1 : 0.5;
			ctx.strokeStyle = css('--' + band);
			ctx.lineWidth = (highlight ? 2 : 1.25)*s;
			ctx.beginPath();
			xs.forEach((x, i) => {
				const y = yOf(clampDb(sections[i][band]));
				i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
			});
			ctx.stroke();
		}
		ctx.globalAlpha = 1;
		ctx.strokeStyle = css('--curve');
		ctx.lineWidth = 2.5*s;
		ctx.lineJoin = 'round';
		ctx.beginPath();
		xs.forEach((x, i) => {
			const y = yOf(clampDb(EqResponse.responseDb(state, sampleRate, fOf(x))));
			i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
		});
		ctx.stroke();
		ctx.restore();

		if (eqOn) {
			for (const [band, freqKey] of Object.entries(BAND_FREQ)) {
				const f = state[freqKey];
				const x = xOf(f), y = yOf(clampDb(EqResponse.sectionsDb(state, sampleRate, f)[band]));
				ctx.beginPath();
				ctx.arc(x, y, (hoveredBand === band ? 6 : 4.5)*s, 0, 2*Math.PI);
				ctx.fillStyle = css('--' + band);
				ctx.fill();
				ctx.lineWidth = 1.5*s;
				ctx.strokeStyle = css('--screen');
				ctx.stroke();
			}
		}
	}

	// ---- rendering ----

	let frame = 0;
	function render() {
		if (frame) return;
		frame = requestAnimationFrame(() => {
			frame = 0;
			knobEls.forEach(el => {
				const key = el.dataset.key;
				const rotation = `rotate(${valueToAngle(key, state[key])})`;
				el.querySelectorAll('.rotate').forEach(group => group.setAttribute('transform', rotation));
				el.setAttribute('aria-valuetext', format(key, state[key]));
			});
			switchEls.forEach(({el, key}) => el.querySelector('button').setAttribute('aria-pressed', state[key] >= 0.5));
			if (bubbleOwner) showBubble(bubbleOwner, bubbleOwner.dataset.key);
			else bubble.style.display = 'none';
			drawCurve();
		});
	}
	render();
	send('ready');
	// ask for changes made elsewhere (automation, the host's own controls) while we're visible
	setInterval(() => {
		if (document.visibilityState === 'visible') send('poll');
	}, 33);
</script>
</body>
</html>
